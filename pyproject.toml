[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Autonomous GitHub Issue-to-Verified-Fix Agent with Verified Recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "neatlogs>=1.1.8",
    "openai>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
