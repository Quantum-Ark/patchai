version: 1.0
runtime: python-3
build:
  commands:
    build:
      - apt-get update && apt-get install -y git curl ca-certificates
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install -e .
run:
  command: python -m patchpilot.server --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: PORT
      value: "8080"
    - name: HOST
      value: "0.0.0.0"
    - name: MODEL
      value: "gpt-4o-mini"
